name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SIMULACRUM_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (core + dev, NO ml extra -- fast install)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import-order check (finding 003)
        run: python tests/check_import_order.py

      - name: Run test suite (no GROQ_API_KEY, no ml extra -- Groq/MiniLM
              tests skip cleanly, confirmed pattern used throughout this
              project)
        run: python -m pytest tests/unit/ -v

      - name: Fresh-clone reproducibility check (§22)
        run: |
          python -m venv /tmp/fresh-check
          /tmp/fresh-check/bin/pip install --upgrade pip --quiet
          /tmp/fresh-check/bin/pip install -e ".[dev]" --quiet
          /tmp/fresh-check/bin/python -m pytest tests/unit/ 2>&1 | tail -5
