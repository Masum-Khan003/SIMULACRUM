[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulacrum"
version = "0.0.1"
description = "Behavioral guardrails for tool-calling AI agents"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "prometheus-client>=0.20",
    "groq>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
ml = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
